name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Single-file `cardinal` binaries with the app embedded, attached to the
  # GitHub release: the way to run Cardinal on your own machine, so
  # credentials and queries never reach a Cardinal server. macOS binaries are
  # built (and ad-hoc signed, which Apple Silicon requires) on macOS.
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: bun-linux-x64 bun-linux-arm64 bun-windows-x64
          - os: macos-latest
            targets: bun-darwin-arm64 bun-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: CARDINAL_VERSION="${GITHUB_REF_NAME}" bun server/build.ts ${{ matrix.targets }}
      - if: runner.os == 'macOS'
        run: for file in server/dist/cardinal-darwin-*; do codesign --force --sign - "$file"; done
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: server/dist/cardinal-*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum cardinal-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cardinal-*
            dist/SHA256SUMS
            install.sh

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ta3/cardinal
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

